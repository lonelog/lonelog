version: 2

# The documentation now lives at https://lonelog.org (Quarto website, built by
# .github/workflows/publish.yml). The three Read the Docs projects (lonelog,
# lonelog-it, lonelog-fr) only publish a redirect page, served both as the
# index and as the 404 page, so old links land on the same page on lonelog.org.

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    build:
      html:
        - mkdir -p $READTHEDOCS_OUTPUT/html/
        - sed "s/__LANG__/$READTHEDOCS_LANGUAGE/g" .readthedocs/redirect.html > $READTHEDOCS_OUTPUT/html/index.html
        - cp $READTHEDOCS_OUTPUT/html/index.html $READTHEDOCS_OUTPUT/html/404.html
